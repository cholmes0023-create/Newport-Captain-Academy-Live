name: Load Expanded SOG Bank
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-officer-rubrics.yml'
      - 'sog-bank.js'
permissions:
  contents: write
jobs:
  patch-academy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load expanded bank and strengthen repeat protection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '<script src="sog-bank.js"></script>' not in s:
              s=s.replace('<script>\nconst S=[','<script src="sog-bank.js"></script><script>\nlet S=[')
              s=s.replace('<script>const S=[','<script src="sog-bank.js"></script><script>let S=[')
          s=s.replace('const S=[','let S=[',1)
          marker='];\nconst F='
          if 'NCA_SOG_BANK.length' not in s and marker in s:
              s=s.replace(marker,'];\nif(window.NCA_SOG_BANK&&window.NCA_SOG_BANK.length){S=window.NCA_SOG_BANK;}\nconst F=',1)
          s=s.replace("const recent=new Set(P.recent.slice(-15));","const recent=new Set(P.recent.slice(-Math.min(250,Math.max(25,S.length-5))));")
          s=s.replace("P.recent=P.recent.slice(-25);","P.recent=P.recent.slice(-Math.min(250,Math.max(25,S.length-5)));")
          s=s.replace('Five questions pulled from a larger rotating bank. Recent questions are held back.','Five questions pulled from the expanded Newport SOG bank. Questions are held back until most of the bank has been used.')
          p.write_text(s)
          PY
      - name: Commit updated academy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply expanded Newport SOG question bank"
          git push
# run 2026-08-02
